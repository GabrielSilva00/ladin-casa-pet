<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#15362A" stop-opacity="1"/>
      <stop offset="100%" stop-color="#071510" stop-opacity="0.75"/>
    </linearGradient>
    <filter id="nz" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="1.2" numOctaves="2" seed="4"/>
      <feColorMatrix values="0 0 0 0 0.07  0 0 0 0 0.05  0 0 0 0 0.04  0 0 0 0.22 0"/>
    </filter>
    <radialGradient id="sun" cx="78%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#F0C454" stop-opacity="0.48"/>
      <stop offset="100%" stop-color="#F0C454" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="800" fill="url(#g)"/>
  <rect width="800" height="800" fill="url(#sun)"/>
  <!-- folhagem silueta -->
  <g opacity="0.45" fill="#071510">
    <ellipse cx="96" cy="680" rx="176" ry="144"/>
    <ellipse cx="720" cy="720" rx="200" ry="128"/>
  </g>
  <g opacity="0.30" fill="#15362A">
    <ellipse cx="400" cy="760" rx="440.00000000000006" ry="80"/>
  </g>
  <!-- centro: círculo + glyph -->
  <g transform="translate(400,400)">
    <circle r="160" fill="#F0E6D1" opacity="0.08"/>
    <circle r="133.33333333333334" fill="none" stroke="#F0E6D1" stroke-width="1" opacity="0.4"/>
    <text text-anchor="middle" y="6" font-family="Instrument Serif, Georgia, serif" font-style="italic" font-size="89" fill="#F0E6D1" opacity="0.95">corte de unhas</text>
  </g>
  <!-- grão 35mm -->
  <rect width="800" height="800" filter="url(#nz)" opacity="0.6"/>
  <!-- caption + brand -->
  <text x="20" y="784" font-family="ui-monospace, monospace" font-size="22" fill="#F0E6D1" opacity="0.6" letter-spacing="1.5">CORTESIA</text>
  <text x="786" y="784" text-anchor="end" font-family="ui-monospace, monospace" font-size="20" fill="#F0E6D1" opacity="0.4" letter-spacing="2">CABANA</text>
</svg>