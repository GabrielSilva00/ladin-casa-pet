<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="900" height="1200">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#F0C454" stop-opacity="1"/>
      <stop offset="100%" stop-color="#DD6B3C" stop-opacity="0.75"/>
    </linearGradient>
    <filter id="nz" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="1.2" numOctaves="2" seed="19"/>
      <feColorMatrix values="0 0 0 0 0.07  0 0 0 0 0.05  0 0 0 0 0.04  0 0 0 0.22 0"/>
    </filter>
    <radialGradient id="sun" cx="78%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#F0E6D1" stop-opacity="0.48"/>
      <stop offset="100%" stop-color="#F0E6D1" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="900" height="1200" fill="url(#g)"/>
  <rect width="900" height="1200" fill="url(#sun)"/>
  <!-- folhagem silueta -->
  <g opacity="0.45" fill="#071510">
    <ellipse cx="108" cy="1020" rx="198" ry="216"/>
    <ellipse cx="810" cy="1080" rx="225" ry="192"/>
  </g>
  <g opacity="0.30" fill="#15362A">
    <ellipse cx="450" cy="1140" rx="495.00000000000006" ry="120"/>
  </g>
  <!-- centro: círculo + glyph -->
  <g transform="translate(450,600)">
    <circle r="180" fill="#F0E6D1" opacity="0.08"/>
    <circle r="150" fill="none" stroke="#F0E6D1" stroke-width="1" opacity="0.4"/>
    <text text-anchor="middle" y="6" font-family="Instrument Serif, Georgia, serif" font-style="italic" font-size="100" fill="#F0E6D1" opacity="0.95">a copa</text>
  </g>
  <!-- grão 35mm -->
  <rect width="900" height="1200" filter="url(#nz)" opacity="0.6"/>
  <!-- caption + brand -->
  <text x="20" y="1184" font-family="ui-monospace, monospace" font-size="25" fill="#F0E6D1" opacity="0.6" letter-spacing="1.5">GRÃOS DO DIA</text>
  <text x="886" y="1184" text-anchor="end" font-family="ui-monospace, monospace" font-size="23" fill="#F0E6D1" opacity="0.4" letter-spacing="2">CABANA</text>
</svg>