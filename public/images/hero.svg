<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <radialGradient id="sun" cx="78%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#E8C566" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#B8502E" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#2D5F3F" stop-opacity="0.0"/>
    </radialGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2D5F3F" stop-opacity="0.0"/>
      <stop offset="55%" stop-color="#2D5F3F" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0F2419" stop-opacity="0.75"/>
    </linearGradient>
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="1.1" numOctaves="2" seed="7"/>
      <feColorMatrix values="0 0 0 0 0.08  0 0 0 0 0.05  0 0 0 0 0.03  0 0 0 0.20 0"/>
    </filter>
  </defs>
  <!-- base creme -->
  <rect width="1920" height="1080" fill="#F4EDE0"/>
  <!-- morro/parque -->
  <path d="M 0 620 Q 480 500 960 580 T 1920 560 L 1920 1080 L 0 1080 Z" fill="#2D5F3F" opacity="0.85"/>
  <path d="M 0 720 Q 640 640 1280 700 T 1920 680 L 1920 1080 L 0 1080 Z" fill="#0F2419" opacity="0.75"/>
  <!-- deque de madeira estilizado -->
  <g opacity="0.85">
    <rect x="1050" y="780" width="820" height="220" fill="#B8502E" opacity="0.55"/>
    <g stroke="#1A1512" stroke-opacity="0.25" stroke-width="2">
      <line x1="1050" y1="820" x2="1870" y2="820"/>
      <line x1="1050" y1="870" x2="1870" y2="870"/>
      <line x1="1050" y1="920" x2="1870" y2="920"/>
      <line x1="1050" y1="970" x2="1870" y2="970"/>
    </g>
    <!-- mesa bistro -->
    <circle cx="1480" cy="760" r="38" fill="#1A1512" opacity="0.7"/>
    <rect x="1476" y="760" width="8" height="90" fill="#1A1512" opacity="0.6"/>
    <!-- xícara -->
    <ellipse cx="1480" cy="748" rx="14" ry="5" fill="#F4EDE0"/>
    <!-- cadeiras -->
    <rect x="1420" y="810" width="30" height="36" fill="#1A1512" opacity="0.55"/>
    <rect x="1510" y="810" width="30" height="36" fill="#1A1512" opacity="0.55"/>
  </g>
  <!-- árvore à esquerda -->
  <g opacity="0.9">
    <rect x="280" y="520" width="18" height="200" fill="#1A1512" opacity="0.6"/>
    <circle cx="289" cy="470" r="110" fill="#0F2419" opacity="0.65"/>
    <circle cx="240" cy="500" r="85" fill="#2D5F3F" opacity="0.7"/>
    <circle cx="350" cy="495" r="95" fill="#2D5F3F" opacity="0.6"/>
  </g>
  <!-- cão silhueta -->
  <g transform="translate(720,780)" fill="#1A1512" opacity="0.72">
    <ellipse cx="60" cy="40" rx="55" ry="22"/>
    <circle cx="105" cy="22" r="18"/>
    <rect x="25" y="55" width="4" height="22"/>
    <rect x="45" y="55" width="4" height="22"/>
    <rect x="80" y="55" width="4" height="22"/>
    <rect x="100" y="55" width="4" height="22"/>
    <path d="M 0 48 Q -14 32 -10 20" stroke="#1A1512" stroke-width="4" fill="none"/>
  </g>
  <!-- luz do sol -->
  <rect width="1920" height="1080" fill="url(#sun)"/>
  <rect width="1920" height="1080" fill="url(#floor)"/>
  <!-- grão 35mm -->
  <rect width="1920" height="1080" filter="url(#noise)" opacity="0.5"/>
</svg>